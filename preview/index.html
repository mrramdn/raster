<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="border-b border-border bg-card">
      <div class="mx-auto max-w-7xl px-4 pt-2 pb-2">
        <div class="flex items-center justify-between">
          <p class="flex items-start gap-1.5">
            <span class="text-xl font-semibold tracking-tight">RASTER</span>
            <span class="text-[0.625rem] leading-4 text-muted-foreground">Beta</span>
          </p>
          <button
            id="theme"
            type="button"
            aria-label="Switch between light and dark"
            class="inline-flex size-9 items-center justify-center rounded-full transition-colors hover:bg-accent"
          ></button>
        </div>
        <div id="filters" class="-mx-1 mt-3 flex gap-2.5 overflow-x-auto p-1" role="group" aria-label="Filter components"></div>
      </div>
    </header>

    <main id="gallery" class="mx-auto grid max-w-7xl grid-cols-1 gap-4 p-4 min-[480px]:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></main>

    <script>
      const icon = (paths, size = 16) =>
        `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      const icons = {
        copy: icon('<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'),
        reset: icon('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'),
        check: icon('<path d="M20 6 9 17l-5-5"/>'),
        contrast: icon('<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>', 20),
        chevron: icon('<path d="m9 18 6-6-6-6"/>', 16),
      };

      const radio =
        'size-5.5 appearance-none rounded-full border-[1.5px] border-input bg-card transition-[border-width,border-color] checked:border-7 checked:border-primary checked:bg-white';
      const tab =
        'h-9 rounded-full px-4 type-ui text-muted-foreground transition-colors aria-selected:bg-card aria-selected:text-foreground aria-selected:shadow-sm';
      const badge = 'inline-flex h-7 items-center gap-1.5 rounded-full bg-secondary px-3 type-caption';
      const row = 'flex h-12 items-center justify-between px-4 type-ui';

      const components = [
        {
          name: 'Button',
          category: 'Input',
          html: `<button type="button" class="inline-flex h-12 items-center justify-center gap-2 rounded-full bg-primary px-7 text-base font-medium text-primary-foreground transition-colors hover:bg-primary-hover disabled:pointer-events-none disabled:opacity-40">Get Started</button>`,
        },
        {
          name: 'Toggle',
          category: 'Input',
          stateful: true,
          html: `<button type="button" role="switch" aria-checked="true" aria-label="Notifications" class="group relative h-7.5 w-17.5 rounded-full bg-input transition-colors aria-checked:bg-primary disabled:opacity-40"><span class="absolute top-1 left-1 h-5.5 w-9 rounded-full bg-white shadow-sm transition-transform group-aria-checked:translate-x-6.5"></span></button>`,
        },
        {
          name: 'Slider',
          category: 'Input',
          stateful: true,
          html: `<input type="range" min="0" max="100" value="50" aria-label="Volume" class="raster-slider" />`,
        },
        {
          name: 'Single Selection',
          category: 'Input',
          stateful: true,
          html: `<fieldset class="space-y-4"><legend class="sr-only">Fulfilment</legend><label class="flex items-center gap-2 type-small"><input type="radio" name="fulfilment" checked class="${radio}" />Delivery</label><label class="flex items-center gap-2 type-small"><input type="radio" name="fulfilment" class="${radio}" />Pickup</label><label class="flex items-center gap-2 type-small"><input type="radio" name="fulfilment" class="${radio}" />Visit</label></fieldset>`,
        },
        {
          name: 'Text Field',
          category: 'Input',
          stateful: true,
          html: `<label class="block w-full"><span class="type-ui">Email</span><input type="email" placeholder="name@example.com" class="mt-2 h-12 w-full rounded-full border border-input bg-card px-5 text-base placeholder:text-muted-foreground disabled:opacity-40" /></label>`,
        },
        {
          name: 'Segmented',
          category: 'Navigation',
          stateful: true,
          html: `<div role="tablist" aria-label="Period" class="inline-flex rounded-full bg-secondary p-1"><button type="button" role="tab" aria-selected="true" class="${tab}">Day</button><button type="button" role="tab" aria-selected="false" class="${tab}">Week</button><button type="button" role="tab" aria-selected="false" class="${tab}">Month</button></div>`,
        },
        {
          name: 'Badge',
          category: 'Status',
          html: `<div class="flex flex-col items-start gap-2"><span class="${badge}"><span class="size-1.5 rounded-full bg-success"></span>Active</span><span class="${badge}"><span class="size-1.5 rounded-full bg-warning"></span>Pending</span><span class="${badge}"><span class="size-1.5 rounded-full bg-destructive"></span>Failed</span></div>`,
        },
        {
          name: 'Progress',
          category: 'Status',
          html: `<div role="progressbar" aria-label="Upload" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" class="h-1.5 w-full overflow-hidden rounded-full bg-secondary"><div class="h-full w-[64%] rounded-full bg-primary"></div></div>`,
        },
        {
          name: 'List',
          category: 'Layout',
          html: `<ul class="w-full divide-y divide-border overflow-hidden rounded-lg border border-border"><li class="${row}">Account<span class="text-muted-foreground">${icons.chevron}</span></li><li class="${row}">Notifications<span class="text-muted-foreground">${icons.chevron}</span></li><li class="${row}">Privacy<span class="text-muted-foreground">${icons.chevron}</span></li></ul>`,
        },
        {
          name: 'Spinner',
          category: 'Motion',
          html: `<span role="status" aria-label="Loading" class="size-7 animate-spin rounded-full border-3 border-secondary border-t-primary"></span>`,
        },
      ];

      const iconButton =
        'inline-flex size-8 items-center justify-center rounded-full text-muted-foreground transition-colors hover:bg-accent hover:text-foreground';
      const chip =
        'h-8 shrink-0 rounded-full bg-secondary px-3.5 type-ui text-muted-foreground transition-colors hover:text-foreground aria-pressed:bg-card aria-pressed:text-foreground aria-pressed:ring-2 aria-pressed:ring-border';

      const gallery = document.getElementById('gallery');
      const filters = document.getElementById('filters');
      const syncSliders = (root) =>
        root.querySelectorAll('input[type=range]').forEach((el) => {
          el.style.setProperty('--slider-fill', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
        });

      document.getElementById('theme').innerHTML = icons.contrast;
      filters.innerHTML = ['All', 'Input', 'Navigation', 'Status', 'Layout', 'Motion']
        .map((name, i) => `<button type="button" aria-pressed="${i === 0}" class="${chip}">${name}</button>`)
        .join('');
      gallery.innerHTML = components
        .map(
          (c, i) => `<article data-index="${i}" data-category="${c.category}" class="flex aspect-[9/10] flex-col rounded-2xl border border-border bg-card">
            <div data-demo class="flex flex-1 items-center justify-center px-6 pt-6">${c.html}</div>
            <footer class="flex h-16 items-center justify-between pr-4.5 pb-2 pl-7">
              <h2 class="type-ui">${c.name}</h2>
              <div class="flex">
                ${c.stateful ? `<button type="button" data-reset aria-label="Reset ${c.name}" class="${iconButton}">${icons.reset}</button>` : ''}
                <button type="button" data-copy aria-label="Copy ${c.name} markup" class="${iconButton}">${icons.copy}</button>
              </div>
            </footer>
          </article>`,
        )
        .join('');
      syncSliders(gallery);

      document.getElementById('theme').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

      filters.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        for (const b of filters.children) b.setAttribute('aria-pressed', b === button);
        for (const card of gallery.children) {
          card.hidden = button.textContent !== 'All' && card.dataset.category !== button.textContent;
        }
      });

      gallery.addEventListener('input', (event) => syncSliders(event.target.parentElement));

      gallery.addEventListener('click', async (event) => {
        const card = event.target.closest('article');
        if (!card) return;
        const component = components[card.dataset.index];
        const toggle = event.target.closest('[role=switch]');
        const selected = event.target.closest('[role=tab]');
        const copy = event.target.closest('[data-copy]');
        if (toggle) toggle.setAttribute('aria-checked', toggle.getAttribute('aria-checked') !== 'true');
        if (selected) for (const t of selected.parentElement.children) t.setAttribute('aria-selected', t === selected);
        if (event.target.closest('[data-reset]')) {
          const demo = card.querySelector('[data-demo]');
          demo.innerHTML = component.html;
          syncSliders(demo);
        }
        if (copy) {
          await navigator.clipboard.writeText(component.html);
          copy.innerHTML = icons.check;
          setTimeout(() => (copy.innerHTML = icons.copy), 1200);
        }
      });
    </script>
  </body>
</html>
